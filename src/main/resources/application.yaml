spring:
  application:
    name: java.advanced.spring.boot
  datasource:
    url: jdbc:h2:mem:booksdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,beans,env
  endpoint:
    health:
      show-details: always
      show-components: always

springdoc:
  show-actuator: true

java-advanced-spring-boot:
  security:
    jwt:
      secret: rX7kL2mP5nQ8sT1vW4yZ9aB3cE6fG0hI4jK
      expiration: PT1H
